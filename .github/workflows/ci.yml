name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofmt found issues in:"
            echo "$diff"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -v ./...

      - name: go test
        run: go test -race -count=1 ./...

  bash:
    name: Bash lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # SC1091: can't follow non-constant source (the lib files are sourced at runtime)
          # SC2034: unused vars (false positives — vars are consumed by sourcing scripts)
          # SC2155: declare-and-assign (preferred for readability in this codebase)
          SHELLCHECK_OPTS: -x -e SC1091,SC2034,SC2155
        with:
          scandir: ./scripts
          severity: error

      - name: bash -n syntax check
        run: |
          set -e
          for f in scripts/btrfs-migrate.sh scripts/lib/*.sh; do
            bash -n "$f"
            echo "ok: $f"
          done
